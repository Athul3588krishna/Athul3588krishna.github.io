  <text x="450" y="215" font-family="'Inter', sans-serif" font-size="13" fill="#94A3B8" letter-spacing="1.5" text-anchor="middle">THIS CERTIFIES THAT</text>
  
  <text x="450" y="270" font-family="'Space Grotesk', sans-serif" font-size="36" font-weight="800" fill="#ffffff" letter-spacing="1" text-anchor="middle">ATHUL KRISHNA R</text>

  <text x="450" y="315" font-family="'Inter', sans-serif" font-size="14" fill="#CBD5E1" text-anchor="middle">has successfully fulfilled all institutional criteria and demonstrated proficiency as a</text>

