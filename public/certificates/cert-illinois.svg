<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560">
  <defs>
    <linearGradient id="iitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0f18" />
      <stop offset="50%" stop-color="#181a29" />
      <stop offset="100%" stop-color="#0f111e" />
    </linearGradient>
    <linearGradient id="iitGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="50%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <rect width="800" height="560" rx="16" fill="url(#iitBg)" stroke="#312236" stroke-width="2"/>
  <rect x="20" y="20" width="760" height="520" rx="12" fill="none" stroke="url(#iitGold)" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="30" y="30" width="740" height="500" rx="10" fill="#0b0c14" fill-opacity="0.9" stroke="#221828"/>

  <!-- Seal / Emblem -->
  <circle cx="400" cy="95" r="34" fill="#241422" stroke="url(#iitGold)" stroke-width="2"/>
  <text x="400" y="103" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" fill="#fb7185" text-anchor="middle">IIT</text>

  <text x="400" y="155" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="600" fill="#fb7185" letter-spacing="4" text-anchor="middle">ILLINOIS INSTITUTE OF TECHNOLOGY &amp; ENTRI ELEVATE</text>
  <text x="400" y="195" font-family="'Space Grotesk', sans-serif" font-size="27" font-weight="800" fill="#f8fafc" text-anchor="middle">Certified User — Full Stack Development (MERN)</text>
  
  <text x="400" y="235" font-family="'Inter', sans-serif" font-size="14" fill="#94a3b8" text-anchor="middle">This is formally conferred to</text>
  <text x="400" y="275" font-family="'Space Grotesk', sans-serif" font-size="26" font-weight="700" fill="#fb7185" text-anchor="middle">ATHUL KRISHNA R</text>
  
  <line x1="250" y1="290" x2="550" y2="290" stroke="#334155" stroke-width="1"/>

  <text x="400" y="325" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">For demonstrating exemplary practical competence in modern MERN stack architecture,</text>
  <text x="400" y="347" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">asynchronous Node.js &amp; Express APIs, MongoDB Atlas database design, and reactive React workflows.</text>

  <g transform="translate(130, 375)">
    <rect x="0" y="0" width="100" height="26" rx="6" fill="#241422"/>
    <text x="50" y="17" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fb7185" text-anchor="middle">React.js</text>

    <rect x="110" y="0" width="100" height="26" rx="6" fill="#241422"/>
    <text x="160" y="17" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fb7185" text-anchor="middle">Node.js</text>

    <rect x="220" y="0" width="100" height="26" rx="6" fill="#241422"/>
    <text x="270" y="17" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fb7185" text-anchor="middle">Express.js</text>

    <rect x="330" y="0" width="110" height="26" rx="6" fill="#241422"/>
    <text x="385" y="17" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fb7185" text-anchor="middle">MongoDB Atlas</text>

    <rect x="450" y="0" width="90" height="26" rx="6" fill="#241422"/>
    <text x="495" y="17" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fb7185" text-anchor="middle">REST APIs</text>
  </g>

  <text x="80" y="475" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b">Credential ID: IIT-ENTRI-MERN-2025-AKR</text>
  <text x="80" y="495" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Issuing Body: Illinois Institute of Technology &amp; Entri</text>

  <text x="720" y="475" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34d399" text-anchor="end">Status: Verified User</text>
  <text x="720" y="495" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">Date: 2025</text>
</svg>
