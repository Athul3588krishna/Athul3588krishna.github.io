  <rect x="180" y="340" width="540" height="46" rx="23" fill="url(#illinoisRed)" fill-opacity="0.12" stroke="url(#illinoisRed)" stroke-opacity="0.5"/>
  <text x="450" y="370" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#FF7844" letter-spacing="1" text-anchor="middle">CERTIFIED USER — FULL STACK DEVELOPMENT (MERN)</text>

