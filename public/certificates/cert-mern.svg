  <rect x="20" y="20" width="760" height="520" rx="12" fill="none" stroke="url(#goldBorder)" stroke-width="1.5" stroke-dasharray="8 4"/>
  <rect x="30" y="30" width="740" height="500" rx="10" fill="#0d0f1a" fill-opacity="0.9" stroke="#1f233a"/>

