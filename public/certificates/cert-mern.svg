    <rect x="0" y="0" width="90" height="26" rx="6" fill="#1e243b"/>
    <text x="45" y="17" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8" text-anchor="middle">React.js</text>

    <rect x="105" y="0" width="90" height="26" rx="6" fill="#1e243b"/>
    <text x="150" y="17" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34d399" text-anchor="middle">Node.js</text>

    <rect x="210" y="0" width="100" height="26" rx="6" fill="#1e243b"/>
    <text x="260" y="17" font-family="'JetBrains Mono', monospace" font-size="11" fill="#c084fc" text-anchor="middle">Express.js</text>

    <rect x="325" y="0" width="95" height="26" rx="6" fill="#1e243b"/>
    <text x="372" y="17" font-family="'JetBrains Mono', monospace" font-size="11" fill="#4ade80" text-anchor="middle">MongoDB</text>

