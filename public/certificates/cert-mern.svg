  <text x="400" y="280" font-family="'Space Grotesk', sans-serif" font-size="26" font-weight="700" fill="#38bdf8" text-anchor="middle">ATHUL KRISHNA R</text>
  
  <line x1="250" y1="295" x2="550" y2="295" stroke="#334155" stroke-width="1"/>

  <text x="400" y="330" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">For demonstrating exemplary competence in architecting full-stack web applications,</text>
  <text x="400" y="352" font-family="'Inter', sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">RESTful API design with Node &amp; Express, MongoDB aggregation pipelines, and reactive state management.</text>

