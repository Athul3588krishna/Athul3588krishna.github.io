<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="eyBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D14"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FF4A17"/>
    </linearGradient>
    <linearGradient id="routeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4A17"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="eyGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#eyBgGrad)"/>
  
  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 50 H800 M0 100 H800 M0 150 H800 M0 200 H800 M0 250 H800 M0 300 H800 M0 350 H800 M0 400 H800 M0 450 H800"/>
    <path d="M50 0 V500 M100 0 V500 M150 0 V500 M200 0 V500 M250 0 V500 M300 0 V500 M350 0 V500 M400 0 V500 M450 0 V500 M500 0 V500 M550 0 V500 M600 0 V500 M650 0 V500 M700 0 V500 M750 0 V500"/>
  </g>

  <!-- Glowing Radar Circles -->
  <circle cx="280" cy="250" r="180" stroke="#FF4A17" stroke-opacity="0.12" stroke-width="1.5" fill="none"/>
  <circle cx="280" cy="250" r="120" stroke="#FF4A17" stroke-opacity="0.2" stroke-width="1.5" fill="none"/>
  <circle cx="280" cy="250" r="60" stroke="#FF4A17" stroke-opacity="0.3" stroke-width="1.5" fill="#FF4A17" fill-opacity="0.05"/>

  <!-- Main HUD Frame -->
  <rect x="80" y="60" width="640" height="380" rx="20" fill="#0C0D16" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>

  <!-- Top Bar -->
  <circle cx="110" cy="90" r="5" fill="#EF4444" fill-opacity="0.8"/>
  <circle cx="128" cy="90" r="5" fill="#F59E0B" fill-opacity="0.8"/>
  <circle cx="146" cy="90" r="5" fill="#10B981" fill-opacity="0.8"/>
  <text x="175" y="94" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8" letter-spacing="1">EY_AUTO_DISPATCH // SOCKET.IO_BIDIRECTIONAL_GPS</text>
  <rect x="590" y="80" width="110" height="20" rx="6" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-opacity="0.4"/>
  <text x="645" y="94" font-family="'JetBrains Mono', monospace" font-size="10" fill="#FBBF24" text-anchor="middle" font-weight="600">3 MODULES ACTIVE</text>

  <!-- Left Map Navigation & Route -->
  <g transform="translate(110, 125)">
    <rect width="320" height="280" rx="14" fill="#08090E" stroke="#ffffff" stroke-opacity="0.08"/>
    
    <!-- Stylized Roads -->
    <path d="M40 80 H280 M120 20 V260 M220 40 V240 M40 200 H280" stroke="#1E293B" stroke-width="12" stroke-linecap="round"/>
    <path d="M40 80 H280 M120 20 V260 M220 40 V240 M40 200 H280" stroke="#334155" stroke-width="4" stroke-dasharray="8 6"/>

    <!-- Active Trip Route Path -->
    <path d="M80 80 H120 V200 H220 V140" stroke="url(#routeGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#eyGlow)"/>

    <!-- Pickup Marker -->
    <circle cx="80" cy="80" r="8" fill="#10B981" stroke="#ffffff" stroke-width="2"/>
    <text x="95" y="75" font-family="'JetBrains Mono', monospace" font-size="9" fill="#34D399" font-weight="700">PICKUP: VALANCHERY</text>

    <!-- Destination Marker -->
    <circle cx="220" cy="140" r="8" fill="#FF4A17" stroke="#ffffff" stroke-width="2"/>
    <text x="160" y="125" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FF7844" font-weight="700">DEST: KRS COLLEGE</text>

    <!-- Auto Rickshaw Moving Marker -->
    <circle cx="160" cy="200" r="14" fill="#F59E0B" fill-opacity="0.3" filter="url(#eyGlow)"/>
    <circle cx="160" cy="200" r="7" fill="#F59E0B" stroke="#ffffff" stroke-width="1.5"/>
    <text x="160" y="228" font-family="'JetBrains Mono', monospace" font-size="9" fill="#FBBF24" text-anchor="middle" font-weight="bold">AUTO #KL-55-E-4210</text>
  </g>

  <!-- Right Dashboard Cards -->
  <g transform="translate(460, 125)">
    
    <!-- Trip Status Card -->
    <rect width="230" height="85" rx="12" fill="#0E101A" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="16" y="25" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Ride Dispatch Status</text>
    <text x="16" y="48" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#10B981">DRIVER EN ROUTE</text>
    <text x="16" y="68" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">ETA: 3.4 mins • 1.8 km</text>

    <!-- Socket.IO Telemetry Card -->
    <g transform="translate(0, 100)">
      <rect width="230" height="90" rx="12" fill="#0E101A" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="16" y="24" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Socket.IO Event Stream</text>
      
      <circle cx="24" cy="42" r="3.5" fill="#34D399"/>
      <text x="34" y="45" font-family="'JetBrains Mono', monospace" font-size="9" fill="#CBD5E1">trip:driver_accepted (32ms)</text>

      <circle cx="24" cy="60" r="3.5" fill="#38BDF8"/>
      <text x="34" y="63" font-family="'JetBrains Mono', monospace" font-size="9" fill="#CBD5E1">gps:location_broadcast</text>

      <circle cx="24" cy="78" r="3.5" fill="#F59E0B"/>
      <text x="34" y="81" font-family="'JetBrains Mono', monospace" font-size="9" fill="#CBD5E1">auth:jwt_session_valid</text>
    </g>

    <!-- Module Badges -->
    <g transform="translate(0, 205)">
      <rect width="70" height="70" rx="10" fill="#0E101A" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="35" y="32" font-family="'JetBrains Mono', monospace" font-size="16" fill="#38BDF8" text-anchor="middle">👤</text>
      <text x="35" y="52" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8" text-anchor="middle">Passenger</text>

      <rect x="80" y="0" width="70" height="70" rx="10" fill="#0E101A" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="115" y="32" font-family="'JetBrains Mono', monospace" font-size="16" fill="#F59E0B" text-anchor="middle">🛺</text>
      <text x="115" y="52" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8" text-anchor="middle">Driver</text>

      <rect x="160" y="0" width="70" height="70" rx="10" fill="#0E101A" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="195" y="32" font-family="'JetBrains Mono', monospace" font-size="16" fill="#A855F7" text-anchor="middle">🛡️</text>
      <text x="195" y="52" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8" text-anchor="middle">Admin</text>
    </g>

  </g>

</svg>