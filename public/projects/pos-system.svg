<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="posBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D14"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#FF4A17"/>
    </linearGradient>
    <filter id="posGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#posBgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 50 H800 M0 100 H800 M0 150 H800 M0 200 H800 M0 250 H800 M0 300 H800 M0 350 H800 M0 400 H800 M0 450 H800"/>
    <path d="M50 0 V500 M100 0 V500 M150 0 V500 M200 0 V500 M250 0 V500 M300 0 V500 M350 0 V500 M400 0 V500 M450 0 V500 M500 0 V500 M550 0 V500 M600 0 V500 M650 0 V500 M700 0 V500 M750 0 V500"/>
  </g>

  <!-- Main HUD Frame -->
  <rect x="80" y="60" width="640" height="380" rx="20" fill="#0C0D16" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>

  <!-- Top Window Header -->
  <circle cx="110" cy="90" r="5" fill="#EF4444" fill-opacity="0.8"/>
  <circle cx="128" cy="90" r="5" fill="#F59E0B" fill-opacity="0.8"/>
  <circle cx="146" cy="90" r="5" fill="#10B981" fill-opacity="0.8"/>
  <text x="175" y="94" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94A3B8" letter-spacing="1">ELECTRON_DESKTOP // SQLITE3_ACID_OFFLINE_CORE</text>
  <rect x="585" y="80" width="115" height="20" rx="6" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.4"/>
  <text x="642" y="94" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34D399" text-anchor="middle" font-weight="600">OFFLINE READY</text>

  <!-- Left: Checkout & Barcode Scanner Area -->
  <g transform="translate(110, 125)">
    <rect width="320" height="280" rx="14" fill="#08090E" stroke="#ffffff" stroke-opacity="0.08"/>
    
    <!-- Cashier Screen Title -->
    <text x="20" y="32" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#ffffff">Active Retail Checkout Terminal</text>

    <!-- Barcode Box with Laser Beam -->
    <g transform="translate(20, 50)">
      <rect width="280" height="70" rx="8" fill="#11131E" stroke="#ffffff" stroke-opacity="0.06"/>
      
      <!-- Barcode Bars -->
      <g transform="translate(40, 15)" fill="#ffffff" fill-opacity="0.75">
        <rect x="0" y="0" width="3" height="30"/>
        <rect x="6" y="0" width="2" height="30"/>
        <rect x="12" y="0" width="5" height="30"/>
        <rect x="22" y="0" width="1" height="30"/>
        <rect x="28" y="0" width="4" height="30"/>
        <rect x="36" y="0" width="2" height="30"/>
        <rect x="44" y="0" width="6" height="30"/>
        <rect x="55" y="0" width="2" height="30"/>
        <rect x="62" y="0" width="4" height="30"/>
        <rect x="70" y="0" width="1" height="30"/>
        <rect x="76" y="0" width="5" height="30"/>
        <rect x="86" y="0" width="3" height="30"/>
        <rect x="94" y="0" width="2" height="30"/>
        <rect x="100" y="0" width="6" height="30"/>
        <rect x="112" y="0" width="3" height="30"/>
        <rect x="120" y="0" width="2" height="30"/>
        <rect x="126" y="0" width="4" height="30"/>
        <rect x="135" y="0" width="1" height="30"/>
        <rect x="142" y="0" width="5" height="30"/>
        <rect x="152" y="0" width="2" height="30"/>
        <rect x="160" y="0" width="4" height="30"/>
        <rect x="170" y="0" width="3" height="30"/>
        <rect x="178" y="0" width="1" height="30"/>
        <rect x="185" y="0" width="5" height="30"/>
        <rect x="195" y="0" width="2" height="30"/>
      </g>

      <!-- Laser Scanner Beam -->
      <line x1="20" y1="30" x2="260" y2="30" stroke="url(#laserGrad)" stroke-width="2" filter="url(#posGlow)"/>
      <text x="140" y="58" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8" text-anchor="middle">SKU: 8901030-984421 [SCANNED]</text>
    </g>

    <!-- Table of Items Scanned -->
    <g transform="translate(20, 135)">
      <rect width="280" height="85" rx="8" fill="#11131E" stroke="#ffffff" stroke-opacity="0.06"/>
      <text x="15" y="24" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">ITEM DESCRIPTION</text>
      <text x="180" y="24" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">QTY</text>
      <text x="240" y="24" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">TOTAL</text>
      
      <line x1="15" y1="32" x2="265" y2="32" stroke="#ffffff" stroke-opacity="0.08"/>
      
      <text x="15" y="50" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#ffffff">Premium Espresso Roast</text>
      <text x="185" y="50" font-family="'JetBrains Mono', monospace" font-size="11" fill="#CBD5E1">2</text>
      <text x="235" y="50" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34D399 font-weight-bold">₹760</text>

      <text x="15" y="70" font-family="'Space Grotesk', sans-serif" font-size="11" fill="#ffffff">Organic Green Tea Leaf</text>
      <text x="185" y="70" font-family="'JetBrains Mono', monospace" font-size="11" fill="#CBD5E1">1</text>
      <text x="235" y="70" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34D399 font-weight-bold">₹240</text>
    </g>

    <!-- Total Due Pill -->
    <g transform="translate(20, 230)">
      <rect width="280" height="36" rx="8" fill="#FF4A17" fill-opacity="0.15" stroke="#FF4A17" stroke-opacity="0.4"/>
      <text x="15" y="23" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#ffffff">TOTAL PAYABLE</text>
      <text x="265" y="24" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="800" fill="#FF7844" text-anchor="end">₹1,000.00</text>
    </g>
  </g>

  <!-- Right: SQLite Relational & Performance Metrics -->
  <g transform="translate(460, 125)">
    <!-- SQLite Relational Engine Box -->
    <rect width="230" height="110" rx="12" fill="#0E101A" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="16" y="26" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Local SQLite Database</text>
    
    <g transform="translate(16, 42)">
      <circle cx="6" cy="6" r="3" fill="#38BDF8"/>
      <text x="16" y="9" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">tables: products, orders, ledger</text>

      <circle cx="6" cy="24" r="3" fill="#A855F7"/>
      <text x="16" y="27" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">IPC: Synchronous Main Channel</text>

      <circle cx="6" cy="42" r="3" fill="#10B981"/>
      <text x="16" y="45" font-family="'JetBrains Mono', monospace" font-size="9" fill="#34D399">ACID Transactions Guaranteed</text>

      <circle cx="6" cy="60" r="3" fill="#F59E0B"/>
      <text x="16" y="63" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94A3B8">Zero-Cloud Latency: &lt;1.2ms</text>
    </g>

    <!-- Thermal Receipt Preview -->
    <g transform="translate(0, 125)">
      <rect width="230" height="150" rx="12" fill="#0E101A" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="16" y="26" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Thermal Receipt Engine</text>
      
      <rect x="16" y="40" width="198" height="95" rx="6" fill="#171926" stroke="#ffffff" stroke-opacity="0.04"/>
      <text x="115" y="60" font-family="'JetBrains Mono', monospace" font-size="9" fill="#F8FAFC" text-anchor="middle" font-weight="bold">STORE #042 MALAPPURAM</text>
      <text x="115" y="74" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94A3B8" text-anchor="middle">TXN: #POS-2026-9810</text>
      <line x1="30" y1="82" x2="200" y2="82" stroke="#ffffff" stroke-opacity="0.1" stroke-dasharray="2 2"/>
      <text x="30" y="96" font-family="'JetBrains Mono', monospace" font-size="8" fill="#CBD5E1">ITEMS (2)  •  TAX INCL.</text>
      <text x="30" y="112" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#10B981">PAID: CASH ₹1000.00</text>
      <text x="30" y="126" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94A3B8">ESC/POS PRINTER DRIVER OK</text>
    </g>
  </g>

</svg>