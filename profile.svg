<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="pfpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" rx="36" fill="url(#avatarBg)"/>
  
  <!-- Outer tech orbit ring -->
  <circle cx="300" cy="300" r="260" fill="none" stroke="url(#neonGlow)" stroke-width="2" stroke-dasharray="16 12" filter="url(#pfpGlow)"/>
  <circle cx="300" cy="300" r="230" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

  <!-- Matrix / Cyber grid lines -->
  <line x1="120" y1="300" x2="480" y2="300" stroke="rgba(6,182,212,0.15)" stroke-width="1"/>
  <line x1="300" y1="120" x2="300" y2="480" stroke="rgba(139,92,246,0.15)" stroke-width="1"/>

  <!-- Central Silhouette Graphic: Developer with Laptop & Glowing Neon Code Accents -->
  <!-- Shoulders & Torso -->
  <path d="M 170,490 Q 220,380 300,380 Q 380,380 430,490 Z" fill="#0f172a" stroke="#334155" stroke-width="3"/>
  
  <!-- Hoodie / Collar -->
  <path d="M 230,400 L 300,450 L 370,400" fill="none" stroke="url(#neonGlow)" stroke-width="4" stroke-linecap="round"/>

  <!-- Head -->
  <ellipse cx="300" cy="280" rx="72" ry="92" fill="#1e293b" stroke="#475569" stroke-width="2"/>

  <!-- Hair / Silhouette Style -->
  <path d="M 225,260 Q 230,190 300,185 Q 370,190 375,260 Q 350,220 300,225 Q 250,220 225,260 Z" fill="#0b0f19"/>

  <!-- Stylish Glasses / Cyber Visor -->
  <rect x="240" y="260" width="120" height="26" rx="13" fill="#06b6d4" fill-opacity="0.2" stroke="#22d3ee" stroke-width="2.5" filter="url(#pfpGlow)"/>
  <line x1="250" y1="273" x2="350" y2="273" stroke="#67e8f9" stroke-width="2"/>

  <!-- Headphones -->
  <path d="M 220,240 Q 300,160 380,240" fill="none" stroke="#64748b" stroke-width="7" stroke-linecap="round"/>
  <rect x="210" y="240" width="22" height="55" rx="10" fill="#334155" stroke="#38bdf8" stroke-width="2"/>
  <rect x="368" y="240" width="22" height="55" rx="10" fill="#334155" stroke="#8b5cf6" stroke-width="2"/>

  <!-- Laptop with Glowing Screen -->
  <polygon points="210,490 390,490 370,430 230,430" fill="#020617" stroke="#38bdf8" stroke-width="2"/>
  <rect x="245" y="440" width="110" height="40" rx="4" fill="#06b6d4" fill-opacity="0.3" filter="url(#pfpGlow)"/>
  <text x="300" y="465" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#22d3ee" text-anchor="middle">&lt;AKR /&gt;</text>

  <!-- Floating Status Badge -->
  <rect x="180" y="525" width="240" height="38" rx="19" fill="#0d111e" stroke="rgba(255,255,255,0.15)" stroke-width="1.2"/>
  <circle cx="205" cy="544" r="6" fill="#10b981">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="315" y="549" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#f1f5f9" text-anchor="middle">Full Stack Developer</text>
</svg>
